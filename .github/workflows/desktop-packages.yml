name: Desktop Packages (unsigned)

on:
  push:
    branches: [ 'feature/kmp' ]
    paths:
      - 'shared/**'
      - 'ui/**'
      - 'desktopApp/**'
      - 'gradle/**'
      - '**.gradle.kts'
      - '.github/workflows/desktop-packages.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build .deb package
        run: bash ./gradlew :desktopApp:packageDistributionForCurrentOS

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepr-desktop-ubuntu-latest
          path: desktopApp/build/compose/binaries/main/*/*
          retention-days: 14

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build .msi package
        shell: bash
        run: bash ./gradlew :desktopApp:packageDistributionForCurrentOS

      - name: Upload .msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepr-desktop-windows-latest
          path: desktopApp/build/compose/binaries/main/*/*
          retention-days: 14

  dmg:
    runs-on: macos-15-intel  # arm64 macOS pool had no capacity (see kmp-ios.yml)
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The cache key ignores CPU arch; an arm64-saved cache restored on Intel lacked Kotlin/Native klibs (2026-11-05).
          cache-disabled: true

      - name: Build .dmg package
        run: bash ./gradlew :desktopApp:packageDistributionForCurrentOS

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepr-desktop-macos-15-intel
          path: desktopApp/build/compose/binaries/main/*/*
          retention-days: 14