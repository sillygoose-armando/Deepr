name: KMP iOS UI test

# Separate from "KMP iOS compile": the arm64 macOS pool is often out of capacity (job cancelled after ~15 min
# without a runner), which must not turn the compile check red. Nightly run retries when pushes were unlucky.
on:
  push:
    branches: [ 'feature/kmp' ]
    paths: [ 'shared/**', 'ui/**', 'iosApp/**', 'gradle/**', '**.gradle.kts', 'gradle.properties', '.github/workflows/kmp-ios-ui-test.yml' ]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-ui-test:
    runs-on: macos-15  # arm64 only: Navigation3 publishes no iosX64, so the simulator test can't run on Intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Kotlin tests on the iOS simulator (P2P server runtime, D7)
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen generate

      - name: Run UI tests on the simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*' | sed 's/ *$//')
          echo "Simulator: $DEVICE"
          # Boot first: launching into a cold simulator flakes with "Failed to get background assertion for target app".
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project iosApp/Deepr.xcodeproj -scheme Deepr -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" -resultBundlePath build/ui-tests.xcresult CODE_SIGNING_ALLOWED=NO test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-tests-xcresult
          path: build/ui-tests.xcresult
          retention-days: 7
