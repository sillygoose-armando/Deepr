name: KMP iOS compile

# macOS minutes are gated by path (DECISIONS.md D3).
on:
  push:
    branches: [ 'feature/kmp' ]
    paths: [ 'shared/**', 'ui/**', 'iosApp/**', 'desktopApp/**', 'gradle/**', '**.gradle.kts', 'gradle.properties', '.github/workflows/kmp-ios.yml' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15-intel  # arm64 macOS pool (macos-latest, macos-15) never acquired a runner on 2026-11-05: "not acquired by Runner of type hosted"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'  # jetbrains' resolver hits the unauthenticated GitHub API rate limit on macOS runners

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The cache key ignores CPU arch; an arm64-saved cache restored on Intel lacked Kotlin/Native klibs (2026-11-05).
          cache-disabled: true

      - name: Compile :shared and :ui for iOS
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64 :ui:compileKotlinIosSimulatorArm64 :ui:compileKotlinIosArm64 :ui:linkDebugFrameworkIosSimulatorArm64 :ui:linkDebugFrameworkIosArm64

      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen generate

      - name: Build iOS app for the simulator (unsigned)
        run: >
          xcodebuild -project iosApp/Deepr.xcodeproj -scheme Deepr -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

