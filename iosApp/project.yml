name: Deepr
options:
  bundleIdPrefix: com.yogeshpaliyal
  deploymentTarget:
    iOS: "16.0"
targets:
  Deepr:
    type: application
    platform: iOS
    sources: [Deepr]
    dependencies:
      - target: DeeprShare
    info:
      path: Deepr/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        CFBundleDisplayName: Deepr
    entitlements:
      path: Deepr/Deepr.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yogeshpaliyal.deepr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yogeshpaliyal.deepr
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "-framework"
          - "DeeprUI"
          - "-lsqlite3"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.." && ./gradlew :ui:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
  DeeprShare:
    type: app-extension
    platform: iOS
    sources: [DeeprShare]
    info:
      path: DeeprShare/Info.plist
      properties:
        CFBundleDisplayName: Deepr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: DeeprShare/DeeprShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yogeshpaliyal.deepr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yogeshpaliyal.deepr.share
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "-framework"
          - "DeeprUI"
          - "-lsqlite3"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.." && ./gradlew :ui:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
